services:
  - type: web
    name: me-cam-dashboard
    runtime: python
    plan: starter
    rootDir: ME_CAM-DEV
    buildCommand: pip install -r cloud-requirements.txt
    startCommand: gunicorn --workers 1 --threads 16 --timeout 120 cloud_dashboard:app
    healthCheckPath: /healthz
    disk:
      name: me-cam-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: MECAM_SECRET_KEY
        generateValue: true
      - key: MECAM_SETUP_KEY
        generateValue: true
      - key: MECAM_STORAGE_KEY
        generateValue: true
      - key: MECAM_DATA_DIR
        value: /var/data
      - key: MECAM_COOKIE_SECURE
        value: "1"
